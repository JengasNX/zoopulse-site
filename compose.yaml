name: zoopulse-local
services:
  db-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zoopulse_dev
      POSTGRES_USER: zoopulse_migrator
      POSTGRES_PASSWORD: ${ZOOPULSE_DEV_DB_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - zoopulse-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoopulse_migrator -d zoopulse_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: zoopulse_test
      POSTGRES_USER: zoopulse_test
      POSTGRES_PASSWORD: ${ZOOPULSE_TEST_DB_PASSWORD:-local-test-only}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoopulse_test -d zoopulse_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  zoopulse-dev:
